version: '3'
services:
  legacy-mysql:
    image: 'mysql:5.6'
    environment:
      - MYSQL_ROOT_PASSWORD=my-secret-pw
    ports:
      - "3307:3306"
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql

  legacy-web:
    build: './php56'
    ports:
      - "8082:80"
    volumes:
      - "./www:/var/www/html"
      - "./verify_race_condition.sh:/var/www/verify_race_condition.sh"
    depends_on:
      - legacy-mysql

  legacy-adminer:
    image: adminer:4.6
    depends_on:
      - legacy-mysql
    ports:
      - "8083:8080"
