name: reverse-proxy

services:
  reverse-proxy:
    image: nginx:alpine
    container_name: reverse-proxy
    ports:
      - "8080:80"
    volumes:
      - "./default.conf:/etc/nginx/conf.d/default.conf:ro"
    networks:
      inventory-net:
        aliases:
          - reverse-proxy

networks:
  # レガシー / Laravel の compose と共有する外部ネットワーク。
  #   docker network create inventory-net
  inventory-net:
    external: true
