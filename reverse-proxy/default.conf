# Strangler Fig パターンのルーティング分岐。
#   - 在庫一覧 (/ , /products*)      → Laravel(モダン環境)
#   - それ以外 (*.php を含む全パス)  → レガシー PHP 5.6
#
# location の一致優先度:
#   完全一致 (= /) > 前方一致の長い方 (/products, /build/) > 前方一致 (/)

upstream laravel_upstream {
    server laravel-web:80;
}
upstream legacy_upstream {
    server legacy-web:80;
}

server {
    listen 80;
    server_name _;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # --- モダン環境(Laravel)へ ---
    location = / {
        proxy_pass http://laravel_upstream;
    }

    location /products {
        proxy_pass http://laravel_upstream;
    }

    # Laravel のビルド済みアセット(保険。今回のビューは未使用だが将来用)
    location /build/ {
        proxy_pass http://laravel_upstream;
    }

    # --- それ以外はすべてレガシーへ ---
    location / {
        proxy_pass http://legacy_upstream;
    }
}
